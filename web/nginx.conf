server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Same origin for the UI and the API: no CORS, and the browser never talks to the API directly.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /graphql {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hashed file names: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA entry point must always be revalidated, or browsers keep an old build after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
