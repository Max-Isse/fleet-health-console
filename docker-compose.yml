# Whole stack, one command:  docker compose up --build
# Console: http://localhost:3000   API docs: http://localhost:8000/docs   Keycloak: http://localhost:8080
# Scale the consumer group:      docker compose up -d --scale scorer=3
# Replay the stream again:       docker compose run --rm --no-deps producer

x-python: &python
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  image: fleet-health-console/python:local
  environment: &python-env
    FLEET_KAFKA_BOOTSTRAP: kafka:9092
    FLEET_DATABASE_URL: postgresql://fleet:${POSTGRES_PASSWORD:-fleet_dev_only}@postgres:5432/fleet
    FLEET_OIDC_ISSUER: http://localhost:8080/realms/fleet
    FLEET_OIDC_JWKS_URL: http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
    FLEET_OIDC_AUDIENCE: fleet-api
  volumes:
    - ./data:/app/data
    - artifacts:/app/artifacts

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_only}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  init:
    <<: *python
    command: ["sh", "-c", "fleet fetch && fleet train && fleet init"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  scorer:
    <<: *python
    command: ["fleet", "score"]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}

  producer:
    <<: *python
    command: ["fleet", "produce"]
    depends_on:
      init: {condition: service_completed_successfully}
      scorer: {condition: service_started}

  api:
    <<: *python
    command: ["uvicorn", "fleet.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      retries: 20

  web:
    build:
      context: ./web
    image: fleet-health-console/web:local
    ports: ["3000:8080"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  artifacts:
