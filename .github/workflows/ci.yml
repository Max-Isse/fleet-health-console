name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: fleet_test
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_test"
          --health-interval 3s --health-retries 20
    env:
      FLEET_TEST_DATABASE_URL: postgresql://fleet:ci_only@localhost:5432/fleet_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Unit, API, contract and Postgres integration tests
        run: uv run pytest -q -rs
      - name: Dependency vulnerability audit
        run: uv run pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/Dockerfile.python -t fleet-health-console/python:ci .
          docker build -t fleet-health-console/web:ci web
      - name: Scan the Python image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fleet-health-console/python:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fleet-health-console/web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
